<html>
    <head>
        <link rel="stylesheet" href="css/global.css">
        <link rel="stylesheet" href="css/index.css">
        
    </head>
    <body>
        <header>
            <div class="logo">
                <a href=""><img src="img/Registro Esportivo LOGO.png" width="200"></a>
            </div>
            <h1>LOGIN</h1>
        </header>

        <main>
            <div class="menu-login">
                    <div class="login-box">
                        <p><img src="img/user-icon.png" width="150"></p>
                        <p class="subtitle">Acesse com sua matrícula e senha.</p>

                        <form>  
                            <div class="form-group">
                                <p for="usuario">Matrícula</p>
                                <input type="text" id="usuario" required>
                            </div>

                            <div class="form-group">
                                <label for="senha">Senha</label>

                                <div class="campo-senha">
                                    <input type="password" id="senha" required>

                                    <button type="button" id="mostrarSenha" class="btn-login btn-mostrar">Mostrar</button>
                                </div>
                            </div>
                            <button type="submit" class="btn-login">Login</button>
                        </form>

                    </div>
            </div>
        </main>

        <script type="module" src="js/login.js"></script>
    </body>
</html>
